<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For Dum Dum Rituu</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
      :root {
        --bg-a: #ffe4ec;
        --bg-b: #fff7d6;
        --bg-c: #edf1ff;
        --ink: #2b2331;
        --muted: rgba(43, 35, 49, 0.72);
        --card: rgba(255, 255, 255, 0.7);
        --card-strong: rgba(255, 255, 255, 0.92);
        --accent: #ff7db0;
        --accent-2: #6a74ff;
        --shadow: 0 20px 60px rgba(47, 27, 53, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.6), transparent 38%),
          radial-gradient(circle at bottom right, rgba(255, 255, 255, 0.4), transparent 30%),
          linear-gradient(135deg, var(--bg-a), var(--bg-b) 52%, var(--bg-c));
        overflow: hidden;
      }

      button,
      audio {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .scene {
        height: calc(var(--vh, 1vh) * 100);
        min-height: calc(var(--vh, 1vh) * 100);
        width: 100%;
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.45s ease, transform 0.45s ease;
        padding: 18px 14px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .scene.active {
        opacity: 1;
        pointer-events: auto;
        z-index: 2;
      }

      .scene-inner {
        width: min(980px, 100%);
        text-align: center;
        max-height: 100%;
      }

      .hero-shell,
      .friends-shell {
        background: var(--card);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 32px;
        box-shadow: var(--shadow);
        padding: clamp(16px, 3vw, 28px);
      }

      .friends-shell {
        position: relative;
        overflow: hidden;
      }

      #scene1 .scene-inner {
        width: 100%;
        height: 100%;
      }

      #scene1 .hero-shell {
        width: 100%;
        height: 100%;
        min-height: 100%;
        background: transparent;
        backdrop-filter: none;
        border: none;
        border-radius: 0;
        box-shadow: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .eyebrow {
        display: inline-block;
        margin: 0 0 10px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(255, 125, 176, 0.14);
        color: #a13968;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.78rem;
        font-weight: 700;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        font-size: clamp(2.2rem, 6vw, 4.8rem);
        line-height: 0.98;
        margin-bottom: 14px;
      }

      h2 {
        font-size: clamp(1.6rem, 4vw, 2.8rem);
        margin-bottom: 12px;
      }

      .lead {
        margin: 0 auto;
        max-width: 44rem;
        color: var(--muted);
        font-size: 1.02rem;
        line-height: 1.7;
      }

      .hero-sticker {
        width: min(240px, 56vw);
        margin: 16px auto 14px;
        display: block;
        filter: drop-shadow(0 12px 22px rgba(0, 0, 0, 0.18));
        animation: floaty 4s ease-in-out infinite;
      }

      .primary-btn,
      .secondary-btn,
      .friend-card,
      .back-chip {
        border: none;
        transition: transform 0.22s ease, box-shadow 0.22s ease, opacity 0.22s ease;
      }

      .primary-btn,
      .secondary-btn,
      .back-chip {
        border-radius: 999px;
        padding: 14px 22px;
        font-weight: 700;
        color: var(--ink);
        box-shadow: 0 12px 24px rgba(44, 26, 47, 0.12);
      }

      .primary-btn {
        background: linear-gradient(135deg, #ffbfd3, #ffe6a8);
        font-size: 1rem;
      }

      .secondary-btn,
      .back-chip {
        background: rgba(255, 255, 255, 0.8);
      }

      .primary-btn:hover,
      .secondary-btn:hover,
      .back-chip:hover,
      .friend-card:hover {
        transform: translateY(-2px) scale(1.01);
      }

      .intro-actions {
        margin-top: 6px;
      }

      .scene-copy {
        margin-bottom: 6px;
      }

      .friends-header p {
        color: var(--muted);
        margin-bottom: 0;
      }

      .friends-shell {
        width: min(920px, 100%);
        height: 100%;
      }

      .friend-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 6px;
        transition: opacity 0.35s ease, transform 0.35s ease, filter 0.35s ease;
      }

      .friend-grid.is-hidden {
        opacity: 0;
        transform: scale(0.96);
        pointer-events: none;
        filter: blur(4px);
      }

      .friend-card {
        background: var(--card-strong);
        border-radius: 28px;
        padding: 14px 12px 12px;
        text-align: center;
        box-shadow: 0 18px 38px rgba(56, 36, 62, 0.11);
      }

      .friend-card img {
        display: block;
        width: min(100%, 145px);
        height: 145px;
        object-fit: contain;
        margin: 0 auto 8px;
      }

      .friend-name {
        display: block;
        font-weight: 800;
        font-size: 1rem;
      }

      .friend-hint {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.84rem;
      }

      .spotlight {
        position: absolute;
        inset: 0;
        padding: clamp(14px, 3vw, 26px);
        display: grid;
        gap: 12px;
        align-items: center;
        justify-items: center;
        opacity: 0;
        transform: scale(0.96);
        pointer-events: none;
        transition: opacity 0.35s ease, transform 0.35s ease;
        background: rgba(255, 249, 253, 0.78);
        backdrop-filter: blur(10px);
        z-index: 5;
      }

      .spotlight.show {
        opacity: 1;
        transform: scale(1);
        pointer-events: auto;
      }

      .spotlight-card {
        width: min(100%, 560px);
        background: rgba(255, 255, 255, 0.92);
        border-radius: 30px;
        padding: 16px;
        box-shadow: 0 22px 42px rgba(54, 32, 57, 0.16);
      }

      .spotlight-figure {
        margin: 0;
      }

      .spotlight-figure img {
        width: min(100%, 190px);
        display: block;
        margin: 0 auto;
        filter: drop-shadow(0 14px 24px rgba(0, 0, 0, 0.16));
        animation: floaty 4.5s ease-in-out infinite;
      }

      .spotlight-copy {
        margin-top: 10px;
      }

      .spotlight-copy h3 {
        margin-bottom: 6px;
        font-size: 1.35rem;
      }

      .spotlight-copy p {
        margin: 0 0 10px;
        color: var(--muted);
        line-height: 1.45;
        font-size: 0.92rem;
      }

      .spotlight audio {
        width: 100%;
      }

      .spotlight-actions {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .back-chip {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(255, 241, 219, 0.95));
      }

      .floating-sparkle {
        position: fixed;
        pointer-events: none;
        z-index: 1;
        font-size: 18px;
        animation: driftUp linear forwards;
      }

      @keyframes floaty {
        0%,
        100% {
          transform: translateY(0) rotate(-1deg);
        }
        50% {
          transform: translateY(-8px) rotate(1deg);
        }
      }

      @keyframes driftUp {
        0% {
          transform: translateY(0) translateX(0);
          opacity: 0.14;
        }
        100% {
          transform: translateY(-120vh) translateX(var(--drift));
          opacity: 0;
        }
      }

      @media (max-width: 720px) {
        .scene {
          padding: 10px;
        }

        .friends-shell {
          padding: 12px;
        }

        .friends-header h2 {
          font-size: 1.55rem;
          margin-bottom: 6px;
        }

        .friends-header p {
          font-size: 0.84rem;
          line-height: 1.35;
        }

        .friend-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
          margin-top: 6px;
        }

        .friend-card {
          padding: 10px 8px 8px;
          border-radius: 18px;
        }

        .friend-card img {
          width: min(100%, 92px);
          height: 92px;
          margin-bottom: 6px;
        }

        .friend-name {
          font-size: 0.8rem;
        }

        .friend-hint {
          font-size: 0.68rem;
        }

        .friend-card[data-friend="ritu"] {
          grid-column: 1 / -1;
          width: min(42%, 150px);
          justify-self: center;
        }

        .spotlight {
          gap: 8px;
        }

        .spotlight-card {
          padding: 12px;
          border-radius: 18px;
        }

        .spotlight-figure img {
          width: min(100%, 135px);
        }

        .spotlight-copy {
          margin-top: 8px;
        }

        .spotlight-copy h3 {
          font-size: 1.05rem;
          margin-bottom: 6px;
        }

        .spotlight-copy p {
          font-size: 0.78rem;
          line-height: 1.35;
          margin-bottom: 8px;
        }

        .spotlight-actions {
          gap: 6px;
        }

        .back-chip {
          padding: 10px 16px;
          font-size: 0.82rem;
        }
      }

      @media (max-height: 760px) {
        .hero-sticker {
          width: min(200px, 44vw);
          margin: 12px auto 10px;
        }

        .lead {
          font-size: 0.92rem;
          line-height: 1.45;
        }

        .spotlight-card {
          padding: 12px;
        }

        .spotlight-figure img {
          width: min(100%, 120px);
        }
      }
    </style>
  </head>

  <body>
    <section class="scene active" id="scene1">
      <div class="scene-inner">
        <div class="hero-shell">
          <p class="eyebrow">Birthday surprise</p>
          <div class="scene-copy">
            <h1>Hey beautiful.<br />Happy Birthday!</h1>
            <p class="lead">
            </p>
          </div>

          <img
            src="assets-ritu/images/pic1.png"
            alt="Birthday sticker of her"
            id="heroSticker"
            class="hero-sticker"
          />

          <div class="intro-actions">
            <button id="openFriendsBtn" class="primary-btn">
              Hear from your idiots
            </button>
          </div>
        </div>
      </div>
    </section>

    <section class="scene" id="scene2">
      <div class="scene-inner">
        <div class="friends-shell">
          <div class="friends-header">
            <p class="eyebrow">Tap us!</p>
            <h2>Hear from your idiots!</h2>
            <p>
              
            </p>
          </div>

          <div class="friend-grid" id="friendGrid">
            <button class="friend-card" data-friend="friend2">
              <img src="images/goma-peach.gif" alt="Friend sticker one" />
              <span class="friend-name">Idiot One</span>
              <span class="friend-hint">The loud one</span>
            </button>

            <button class="friend-card" data-friend="friend3">
              <img src="images/goma-peach2.gif" alt="Friend sticker two" />
              <span class="friend-name">Idiot Two</span>
              <span class="friend-hint">The soft one</span>
            </button>

            <button class="friend-card" data-friend="friend4">
              <img src="images/goma-peach3.gif" alt="Friend sticker three" />
              <span class="friend-name">Idiot Three</span>
              <span class="friend-hint">The chaotic one</span>
            </button>

            <button class="friend-card" data-friend="friend5">
              <img src="images/goma-peach4.gif" alt="Friend sticker four" />
              <span class="friend-name">Idiot Four</span>
              <span class="friend-hint">The chaotic one</span>
            </button>

            <button class="friend-card" data-friend="ritu">
              <img src="images/goma-peach4.gif" alt="Bonus sticker" />
              <span class="friend-name">Bonus Idiot</span>
              <span class="friend-hint">The one who started this</span>
            </button>
          </div>

          <div class="spotlight" id="spotlight" aria-live="polite">
            <div class="spotlight-card">
              <figure class="spotlight-figure">
                <img id="spotlightSticker" alt="Selected friend sticker" />
              </figure>

              <div class="spotlight-copy">
                <h3 id="spotlightName">Friend name</h3>
                <p id="spotlightNote">Voice note goes here.</p>
                <audio id="spotlightAudio" controls></audio>
              </div>
            </div>

            <div class="spotlight-actions">
              <button id="backToGridBtn" class="back-chip">Back to other idiots</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script>
      function setViewportUnit() {
        document.documentElement.style.setProperty("--vh", `${window.innerHeight * 0.01}px`);
      }

      setViewportUnit();
      window.addEventListener("resize", setViewportUnit);

      const scenes = Array.from(document.querySelectorAll(".scene"));
      const openFriendsBtn = document.getElementById("openFriendsBtn");
      const heroSticker = document.getElementById("heroSticker");
      const friendGrid = document.getElementById("friendGrid");
      const spotlight = document.getElementById("spotlight");
      const spotlightSticker = document.getElementById("spotlightSticker");
      const spotlightName = document.getElementById("spotlightName");
      const spotlightNote = document.getElementById("spotlightNote");
      const spotlightAudio = document.getElementById("spotlightAudio");
      const backToGridBtn = document.getElementById("backToGridBtn");
      const friendCards = Array.from(document.querySelectorAll(".friend-card"));

      const friendData = {
        friend2: {
          name: "Idiot One",
          note: "The loud one who somehow turns every message into a full event.",
          sticker: "images/goma-peach.gif",
          audio: "assets-ritu/audio-notes/audio1-friend2.mp3",
        },
        friend3: {
          name: "Idiot Two",
          note: "The soft one. The emotional support system. The one with the best timing.",
          sticker: "images/goma-peach2.gif",
          audio: "assets-ritu/audio-notes/audio1-friend3.mp3",
        },
        friend4: {
          name: "Idiot Three",
          note: "The chaotic one. High energy, low chill, strong opinions.",
          sticker: "images/goma-peach3.gif",
          audio: "assets-ritu/audio-notes/audio1-friend4.mp3",
        },
        ritu: {
          name: "Bonus Idiot",
          note: "A tiny extra note because no birthday page is complete without the original menace.",
          sticker: "images/goma-peach4.gif",
          audio: "assets-ritu/audio-notes/audio1-ritu.mp3",
        },
      };

      function showScene(sceneNumber) {
        scenes.forEach((scene) => scene.classList.remove("active"));
        document.getElementById(`scene${sceneNumber}`).classList.add("active");
      }

      function celebrate() {
        if (typeof confetti !== "function") {
          return;
        }

        confetti({ particleCount: 90, spread: 68, origin: { y: 0.65 } });
      }

      function floatSparkles() {
        const symbols = ["✨", "💖", "🌸"];

        setInterval(() => {
          const sparkle = document.createElement("div");
          sparkle.className = "floating-sparkle";
          sparkle.textContent = symbols[Math.floor(Math.random() * symbols.length)];
          sparkle.style.left = `${Math.random() * 100}vw`;
          sparkle.style.animationDuration = `${6 + Math.random() * 4}s`;
          sparkle.style.setProperty("--drift", `${Math.random() * 70 - 35}px`);
          document.body.appendChild(sparkle);

          setTimeout(() => sparkle.remove(), 11000);
        }, 700);
      }

      function openFriends() {
        showScene(2);
        celebrate();
      }

      function focusFriend(friendKey, triggerButton) {
        const friend = friendData[friendKey];

        if (!friend) {
          return;
        }

        friendGrid.classList.add("is-hidden");
        spotlight.classList.add("show");

        spotlightSticker.src = friend.sticker;
        spotlightSticker.alt = `${friend.name} sticker`;
        spotlightName.textContent = friend.name;
        spotlightNote.textContent = friend.note;

        spotlightAudio.pause();
        spotlightAudio.src = friend.audio;
        spotlightAudio.currentTime = 0;
        spotlightAudio.load();

        if (triggerButton) {
          triggerButton.blur();
        }

        celebrate();
      }

      function resetFriendsView() {
        spotlightAudio.pause();
        spotlightAudio.currentTime = 0;
        spotlight.classList.remove("show");
        friendGrid.classList.remove("is-hidden");
      }

      openFriendsBtn.addEventListener("click", openFriends);
      heroSticker.addEventListener("click", celebrate);
      backToGridBtn.addEventListener("click", resetFriendsView);

      friendCards.forEach((card) => {
        card.addEventListener("click", () => {
          focusFriend(card.dataset.friend, card);
        });
      });

      floatSparkles();
    </script>
  </body>
</html>
