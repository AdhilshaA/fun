<!DOCTYPE html>
<html lang="en">
    <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Margarine&family=Nova+Mono&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Proposal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');
        body {
            text-align: center;
            font-family: 'Comic Neue', cursive;
            background-color: rgb(255, 224, 254);
        }
        #title {

            font-family: "Margarine", serif;
            font-weight: 400;
            font-style: normal;
        }

        .textfont {
            font-family: "Margarine", serif;
            font-weight: 400;
            font-style: normal;
        }


        #question-img {
            width: 70%;
            max-width: 300px;
            margin: 20px;
        }
        .button-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        button {
            font-size: 18px;
            padding: 10px 15px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            transition: all 0.3s ease-in-out;
        }
        #yes {
            background-color: #ff69b4;
            color: white;
            <!-- position: absolute; -->
            <!-- left: 30%; -->
            <!-- top: 0%; -->
        }
        #no {
            background-color: #ff4444;
            color: white;
            position: absolute;
            padding-right: 20px;
            left: 58%;
            top: 0%;
        }
        .hidden {
            display: none;
        }
        #attachments {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        #attachments img {
            width: 80%;
            max-width: 250px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
        }

        .gif_container{
            <!-- margin: 20px auto; -->
            width:400px;
            height:300px;
            display:grid;
            grid-template-rows: 150px 150px;
            grid-template-columns: 200px 200px;
            grid-row: auto auto;
            <!-- grid-column-gap: 20px; -->
            <!-- grid-row-gap: 20px; -->
            .gif_box{
                background-color:#9b2020
                padding:0px;
                border-radius:10px;
                color:#fff;
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:40px;
                font-family:sans-serif;
            }
        }

    </style>
</head>
<body>
    <h1 id="title">Will you be my Valentine? (˶˃ ᵕ ˂˶)</h1>
    <div id="title2" class="hidden">
        <p class="textfont">See you on Thursday! (˶˃ ᵕ ˂˶)</p>
    </div>
    <img id="question-img" src="images/question.gif">
    <div class="button-container" id="buttons">
        <button id="yes">Yes</button>
        <button id="no">No</button>
    </div>
    
    <div id="attachments">
        <!-- <div class="row grid-container">
            <img src="images\goma-peach.gif" alt="Attachment 1" class="hidden" width="50%">
            <img src="images\goma-peach3.gif" alt="Attachment 2" class="hidden" width="50%">
        </div>
        <div class="row grid-container">
            <img src="images\goma-peach4.gif" alt="Attachment 3" class="hidden" width="50%">
            <img src="images\goma-peach2.gif" alt="Attachment 4" class="hidden" width="50%"> -->
            <div class="gif_container">
                <div class="gif_box"><img src="images\goma-peach.gif" alt="Attachment 1" class="hidden" width="100%" height="100%"></div>
                <div class="gif_box"><img src="images\goma-peach3.gif" alt="Attachment 2" class="hidden" width="100%" height="100%"></div>
                <div class="gif_box"><img src="images\goma-peach4.gif" alt="Attachment 3" class="hidden" width="100%" height="100%"></div>
                <div class="gif_box"><img src="images\goma-peach2.gif" alt="Attachment 4" class="hidden" width="100%" height="100%"></div>
            </div>
    </div>
    
    <script>
        let noClickCount = 0;
        const noButton = document.getElementById('no');
        const yesButton = document.getElementById('yes');
        const questionImg = document.getElementById('question-img');
        const title = document.getElementById('title');
        const buttons = document.getElementById('buttons');
        const attachments = document.querySelectorAll('#attachments img');
        
        noButton.addEventListener('click', () => {
            noClickCount++;
            
            let newX, newY;

            newX = Math.random() * 80; // Random percentage for X position
            newY = Math.random() * 80; // Random percentage for Y position
            
            
            noButton.style.position = 'absolute';
            noButton.style.left = `${newX}%`;
            noButton.style.top = `${newY}%`;
            
            yesButton.style.transform = `scale(${1 + noClickCount * 0.25})`;
            
            if (noClickCount <= attachments.length) {
                attachments[noClickCount - 1].classList.remove('hidden');
            }
            
            if (noClickCount == 1) {
                title.innerText = 'Why not? ˙◠˙';
                questionImg.src = 'images/question2.gif';
            } else if (noClickCount == 2) {
                title.innerText = 'Please?';
                <!-- questionImg.src = 'images/question3.gif'; -->
            } else if (noClickCount == 3) {
                title.innerText = "Pretty please? (⁠╥⁠﹏⁠╥⁠)" ;
                <!-- questionImg.src = 'images/question4.gif'; -->
            } else if (noClickCount == 4) {
                title.innerText = 'say yes, archiiii! (╥‸╥)';
                <!-- questionImg.src = 'images/question5.gif'; -->
            }
            
            if (noClickCount >= 5) {
                noButton.style.display = 'none';
            }
        });
        
        yesButton.addEventListener('click', () => {
            questionImg.src = 'images/yes.gif';
            title.innerText = 'I love you baby! <3';
            buttons.style.display = 'none';
            attachments[0].classList.remove('hidden');
            attachments[1].classList.remove('hidden');
            attachments[2].classList.remove('hidden');
            attachments[3].classList.remove('hidden');
            title2.classList.remove('hidden');
        });
    </script>
</body>
</html>
